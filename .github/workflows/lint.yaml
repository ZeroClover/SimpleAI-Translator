name: Lint

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    NODE_VERSION: 18

jobs:
    rebrand-guards:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Check telemetry residue
              run: scripts/check-no-telemetry.sh

            - name: Check old identity residue
              run: scripts/check-no-old-identity.sh

    typos-check:
        name: Spell Check with Typos
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6.0.2

            - name: Check spelling with custom config file
              uses: crate-ci/typos@v1.46.2
              with:
                  config: ./typos.toml

    clippy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Install Rust stable
              run: |
                  rustup toolchain install stable --profile minimal --component clippy
                  rustup default stable

            - name: Prepare renderer output directory
              run: mkdir -p ./dist/tauri

            - name: Run clippy
              run: cargo clippy --manifest-path ./src-tauri/Cargo.toml --all-targets -- -D warnings

    rustfmt:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Install Rust stable
              run: |
                  rustup toolchain install stable --profile minimal --component rustfmt
                  rustup default stable

            - name: Run rustfmt
              run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all -- --check

    eslint:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6.0.2

            - uses: pnpm/action-setup@v6.0.8

            - name: Setup Node
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install packages
              run: pnpm install --frozen-lockfile

            - name: Run type check
              run: pnpm tsc

            - name: Run eslint
              run: pnpm lint
