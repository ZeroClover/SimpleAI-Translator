[package]
name = "app"
version = "0.1.0"
description = "SimpleAI Translator desktop application"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = [ "derive" ] }
tauri = { version = "2.12.4", features = [ "macos-private-api", "tray-icon" ] }
enigo = { version = "0.6.1", features = [ "xdo" ] }
mouse_position = "0.1.4"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
parking_lot = "0.12.5"
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.5.0"
tiny_http = "0.12.0"
debug_print = "1.0.0"
active-win-pos-rs = "0.11.0"
reqwest = { version = "0.13.5", features = [ "json", "stream" ] }
reqwest-websocket = "0.6.0"
tokio = { version = "1.53.3", features = [ "full" ] }
futures-util = { version = "0.3.34", features = [ "sink" ] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
base64 = "0.23.1"
httpdate = "1.0.3"
rand = "0.10.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = [ "formatting", "macros" ] }
url = "2.5.8"
uuid = { version = "1.28.0", features = [ "v4" ] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [ "std", "libc", "NSRunningApplication" ] }

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.7.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [ "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation" ] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
