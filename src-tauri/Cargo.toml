[package]
name = "app"
version = "0.1.0"
description = "SimpleAI Translator desktop application"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.78"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
tauri = { version = "2.8.5", features = [ "macos-private-api", "tray-icon" ] }
enigo = { version = "0.2.0", features = [ "xdo" ] }
mouse_position = "0.1.3"
tauri-plugin-single-instance = "2.3.4"
tauri-plugin-autostart = "2.5.0"
parking_lot = "0.12.1"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-shell = "2.3.1"
tiny_http = "0.12.0"
debug_print = "1.0.0"
active-win-pos-rs = "0.8"
reqwest = { version = "0.12", features = [ "json", "stream" ] }
reqwest-websocket = "0.5.0"
tokio = { version = "1", features = [ "full" ] }
futures-util = { version = "0.3.31", features = [ "sink" ] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "export"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "javascript", "typescript"] }
base64 = "0.22.1"
httpdate = "1.0.3"
rand = "0.8.5"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = "0.3.44"
url = "2.5.7"
uuid = { version = "1.18.1", features = [ "v4" ] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.4.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [ "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation" ] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
